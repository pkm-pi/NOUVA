<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesanan Saya - NOUVA</title>
  <link rel="stylesheet" href="../css/pesanan_saya.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/nouva-config.js"></script><script src="../js/nouva-supabase.js"></script><script src="../js/nouva-workflow.js"></script>
</head>
<body>
  <div class="orders-page">    
    <aside class="sidebar">
      <div class="brand">
        <img class="logo-nouva" src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
        <div class="brand-name">NOUVA</div>
        <div class="brand-tagline">NOU MENUJU INOVASI</div>
      </div>

      <nav class="menu" aria-label="Menu pelanggan">
        <a class="menu-link dashboard-menu-link" href="dashboard_pelanggan.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
        <a class="menu-link" href="katalog.html">
          <img src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--4--1.png" alt="">
          <span>Katalog Produk</span>
        </a>
        <a class="menu-link active" href="pesanan_saya.html">
          <img src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--6--1.png" alt="">
          <span>Pesanan Saya</span>
        </a>
        <a class="menu-link" href="pes_cus.html">
          <img src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--5--1.png" alt="">
          <span>Pesan Custom</span>
        </a>
        <a class="menu-link" href="peng_pel.html">
          <img src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--9--1.png" alt="">
          <span>Pengaturan</span>
        </a>
      </nav>
    </aside>
<main class="main-content">
<section class="page-title"><div><h2>Pesanan Saya</h2><p>Lihat dan pantau semua pesanan kamu di sini.</p></div></section>
<nav class="tabs" aria-label="Filter status">
<button class="tab active" data-status="Semua">Semua <b>5</b></button>
<button class="tab" data-status="Sedang Disulam">Sedang Disulam <b>1</b></button>
<button class="tab" data-status="Sedang Dijahit">Sedang Dijahit <b>1</b></button>
<button class="tab" data-status="Siap Diambil">Siap Diambil <b>1</b></button>
<button class="tab" data-status="Selesai">Selesai <b>1</b></button>
<button class="tab" data-status="Dibatalkan">Dibatalkan <b>1</b></button>
</nav>
<section class="orders-table"><div class="table-head"><span>No. Referensi</span><span>Produk</span><span>Total</span><span>Status</span><span>Detail</span></div><div id="orderRows" class="order-rows"><p>Memuat pesanan dari Supabase...</p></div><p id="emptyState" class="empty-state" hidden>Tidak ada pesanan yang sesuai.</p></section></main></div>
<script>
(async()=>{
 const sb=window.nouvaSupabase, wrap=document.getElementById("orderRows"), search=document.getElementById("searchOrders"), empty=document.getElementById("emptyState");
 let orders=[],activeStatus="Semua";
 const esc=NouvaWorkflow.escape,money=NouvaWorkflow.money;
 try{
  const {session,profile}=await NouvaWorkflow.requireRole("customer","../auth/login_pelanggan.html");
  const {data,error}=await sb.from("orders").select("id,reference_no,order_type,customer_name,ordered_at,deadline,process_status,total_amount,order_items(product_name_snapshot,size_snapshot,color_snapshot,quantity),custom_order_details(product_name,quantity)").eq("customer_id",session.user.id).order("created_at",{ascending:false});
  if(error)throw error;orders=data||[];render();
 }catch(e){console.error(e);wrap.innerHTML=`<p class="order-load-error">Pesanan gagal dimuat: ${esc(e.message||e)}</p>`;return}
 function render(){
  const q=(search?.value||"").trim().toLowerCase();
  const shown=orders.filter(o=>(activeStatus==="Semua"||o.process_status===activeStatus)&&[o.reference_no,o.order_type,o.process_status,...(o.order_items||[]).map(i=>i.product_name_snapshot)].join(" ").toLowerCase().includes(q));
  wrap.innerHTML=shown.map(o=>{const items=o.order_items||[],customItems=o.custom_order_details||[],activeItems=o.order_type==="custom"?customItems:items,qty=activeItems.reduce((n,i)=>n+Number(i.quantity||0),0),names=(o.order_type==="custom"?customItems.map(i=>i.product_name):items.map(i=>i.product_name_snapshot)).filter(Boolean).join(", ")||"Detail item belum tersedia";const st=o.process_status||"Menunggu Konfirmasi";const cls=st==="Selesai"?"completed":st==="Dibatalkan"?"cancelled":st==="Siap Diambil"?"ready":"";return `<article class="order-row" data-status="${esc(st)}" data-search="${esc(o.reference_no+" "+names+" "+st)}">
 <div class="order-number"><strong>${esc(o.reference_no||"Pesanan")}</strong></div>
 <div class="order-product"><div class="product-thumb thumb-one">Nouva</div><div><strong>${esc(names)}</strong><small>${qty} pcs · ${o.order_type==="custom"?"Custom":"Display"}</small></div></div>
 <div class="order-total">${money(o.total_amount)}</div><div><span class="status ${cls}"><i></i>${esc(st)}</span></div>
 <div><span class="detail-button" title="Nomor pesanan ${esc(o.reference_no)}">Tercatat ✓</span></div></article>`}).join("");
  empty.hidden=shown.length>0;
  document.querySelectorAll(".tab").forEach(tab=>{
    const key=tab.dataset.status;
    const count=key==="Semua"?orders.length:orders.filter(o=>o.process_status===key).length;
    const badge=tab.querySelector("b"); if(badge) badge.textContent=String(count);
  });
 }
 document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{activeStatus=tab.dataset.status;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===tab));render()}));
 search?.addEventListener("input",render);
})();
</script></body></html>
