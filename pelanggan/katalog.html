<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Produk - NOUVA</title>
  <link rel="stylesheet" href="../globals.css">
  <link rel="stylesheet" href="../css/katalog.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-supabase.js"></script>
  <script src="../js/nouva-workflow.js"></script>
</head>

<body>
  <div class="catalog-page">

    <!-- SIDEBAR PELANGGAN
         Struktur, ukuran, ikon, spacing, dan responsive dipertahankan
         dari katalog pelanggan yang sudah ada. -->
    <aside class="sidebar">
      <div class="brand">
        <img
          class="logo-nouva"
          src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/logo-nouva-fiks-2.png"
          alt="Logo Nouva"
        >
        <div class="brand-name">NOUVA</div>
        <div class="brand-tagline">NOU MENUJU INOVASI</div>
      </div>

      <nav class="menu" aria-label="Menu pelanggan">
        <a class="menu-link dashboard-menu-link" href="dashboard_pelanggan.html">
          <img class="desktop-dashboard-icon"
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--3--1.png"
            alt=""
          >
          <img class="mobile-dashboard-logo"
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/logo-nouva-fiks-2.png"
            alt=""
          >
          <span>Dashboard</span>
        </a>

        <a class="menu-link active" href="katalog.html" aria-current="page">
          <img
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--4--1.png"
            alt=""
          >
          <span>Katalog Produk</span>
        </a>

        <a class="menu-link" href="pesanan_saya.html">
          <img
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--6--1.png"
            alt=""
          >
          <span>Pesanan Saya</span>
        </a>

        <a class="menu-link" href="pes_cus.html">
          <img
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--5--1.png"
            alt=""
          >
          <span>Pesan Custom</span>
        </a>

        <a class="menu-link" href="peng_pel.html">
          <img
            src="https://c.animaapp.com/p1sQDTEtDvvv6RPK6LBx5w/img/image-removebg-preview--9--1.png"
            alt=""
          >
          <span>Pengaturan</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">

      <!-- HEADER PELANGGAN -->
      <header class="catalog-header">
        <div class="welcome">
          <h1>Katalog Produk</h1>
          <p>Lihat semua produk Karawo yang tersedia di UtiKarawo.</p>
        </div>
      </header>

      <!--
        DAFTAR PRODUK PELANGGAN
        Struktur visual mengambil pola produk.html:
        gambar → nama → harga → ketersediaan → aksi pelanggan.
        Fitur admin seperti Edit, Hapus, Tambah Produk, dan menu ⋮
        tidak dibawa ke sisi pelanggan.
      -->
      <section class="products-panel" aria-label="Daftar produk Karawo">
        <div class="catalog-toolbar">
          <label class="header-search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.2 16.2 4.3 4.3"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Cari nama produk, motif, atau warna..."
              aria-label="Cari produk"
            >
          </label>
        </div>
        <div class="products-grid" id="productGrid" aria-live="polite" aria-busy="true">
          <p class="nouva-db-status">Memuat produk aktif dari Supabase...</p>
        </div>

        <div class="empty-state" id="emptyState">
          <strong>Produk tidak ditemukan</strong>
          <span>Coba gunakan kata kunci produk yang lain.</span>
        </div>
      </section>

    </main>
  </div>

  <script>
  (() => {
    const sb = window.nouvaSupabase;
    const grid = document.getElementById("productGrid");
    const search = document.getElementById("searchInput");
    const empty = document.getElementById("emptyState");
    let products = [];
    const esc = NouvaWorkflow.escape;
    const money = NouvaWorkflow.money;
    function imageOf(p) {
      const imgs = [...(p.product_images || [])].sort((a,b)=>(a.sort_order||1)-(b.sort_order||1));
      return imgs.find(x=>x.image_url)?.image_url || p.motif_image_url || "../img/kemeja.png";
    }
    function stockOf(p) { return (p.product_variants||[]).reduce((n,v)=>n+Math.max(0,Number(v.stock)||0),0); }
    function searchable(p) {
      return [p.reference_no,p.name,p.category,p.description,p.fabric_type,p.motif_name,p.motif_description,
        ...(p.product_variants||[]).flatMap(v=>[v.size,v.color_name])].filter(Boolean).join(" ").toLocaleLowerCase("id-ID");
    }
    function choose(p) {
      sessionStorage.setItem("selectedProduct", JSON.stringify({
        id:p.id, reference_no:p.reference_no, name:p.name, price:Number(p.price)||0,
        stock:stockOf(p), image:imageOf(p), images:(p.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order).map(i=>i.image_url),
        category:p.category, description:p.description||"", motif:p.motif_name||"",
        fabric:p.fabric_type||"", variants:p.product_variants||[]
      }));
      location.href="detail_produk.html";
    }
    function render() {
      const q=search.value.trim().toLocaleLowerCase("id-ID");
      const shown=products.filter(p=>searchable(p).includes(q));
      empty.classList.toggle("show", shown.length===0);
      grid.setAttribute("aria-busy","false");
      grid.innerHTML=shown.length?shown.map((p,i)=>`<article class="product-card product-card-db" data-index="${i}" tabindex="0" role="button" aria-label="Lihat ${esc(p.name)}">
        <div class="product-image"><img src="${esc(imageOf(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.closest('.product-image').classList.add('fallback');this.remove()"></div>
        <div class="product-info"><h2>${esc(p.name)}</h2><div class="price">${money(p.price)}</div>
        <div class="availability ${stockOf(p)<=0?'out-of-stock':''}"><span></span>${stockOf(p)>0?'Stok: '+stockOf(p)+' pcs':'Stok habis'}</div>
        <a class="buy-button" href="detail_produk.html" data-buy="${i}"><span class="cart-icon">🛒</span><span>Lihat Detail</span></a></div></article>`).join(""):'';
      grid.querySelectorAll("[data-index]").forEach(card=>{
        const p=shown[Number(card.dataset.index)];
        card.addEventListener("click",e=>{if(!e.target.closest("a,button"))choose(p)});
        card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choose(p)}});
      });
      grid.querySelectorAll("[data-buy]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();choose(shown[Number(a.dataset.buy)])}));
    }
    async function load() {
      if(!sb){grid.innerHTML='<p class="nouva-db-status error">Supabase belum siap. Periksa konfigurasi dan jalankan lewat Live Server.</p>';grid.setAttribute("aria-busy","false");return}
      const {data,error}=await sb.from("products").select("id,reference_no,name,category,description,fabric_type,motif_name,motif_description,motif_image_url,price,is_active,created_at,product_images(image_url,sort_order),product_variants(id,size,color_name,color_image_url,stock)").eq("is_active",true).order("created_at",{ascending:false});
      if(error){console.error(error);grid.innerHTML=`<p class="nouva-db-status error">Katalog gagal dimuat: ${esc(error.message)}</p>`;grid.setAttribute("aria-busy","false");return}
      products=(data||[]).filter(p=>p.is_active===true);
      render();
    }
    search.addEventListener("input",render);
    load();
  })();
  </script>
</body>
</html>
