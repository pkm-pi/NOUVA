<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — NOUVA</title><link rel="stylesheet" href="../css/login_admin.css">
</head>
<body><main class="login-page"><section class="login-container">
<img class="logo" src="https://c.animaapp.com/eMauf843/img/logo-nouva-fiks-2@2x.png" alt="Logo Nouva">
<h1>Selamat Datang Kembali!</h1><p class="desc">Masuk untuk mengelola UtiKarawo dengan lebih mudah</p>
<form class="login-card" id="loginForm">
<label for="identifier">Email atau Nomor Telepon</label><input id="identifier" type="text" placeholder="Email atau 08xxxxxxxxxx" autocomplete="username" required>
<label for="password">Kata Sandi</label><input id="password" type="password" autocomplete="current-password" required>
<button class="btn" id="submitButton" type="submit">Masuk</button><p class="message" id="message" role="alert" aria-live="polite"></p>
</form><a class="switch" href="./login_pelanggan.html">Masuk sebagai Pelanggan</a>
<a class="back-home" href="../index.html">← Kembali ke Beranda</a>
</section></main>

<script>
/* DEMO LOKAL: tidak menggunakan database dan tidak membutuhkan akun khusus. */
const form=document.getElementById("loginForm"), msg=document.getElementById("message"), btn=document.getElementById("submitButton");
form.addEventListener("submit", e => {
  e.preventDefault();
  msg.textContent=""; msg.className="message";
  const id=document.getElementById("identifier").value.trim();
  const password=document.getElementById("password").value;
  if(!id || !password){msg.textContent="Isi email/nomor telepon dan kata sandi terlebih dahulu.";msg.classList.add("error");return;}
  btn.disabled=true; btn.textContent="Membuka dashboard...";
  sessionStorage.setItem("nouva_demo_role","admin");
  sessionStorage.setItem("nouva_demo_identifier",id);
  window.location.href="../admin/dashboard_admin.html";
});
</script></body></html>
