<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi — NOUVA</title>
  <link rel="stylesheet" href="../css/login_pelanggan.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-supabase.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-container">
      <img class="logo" src="https://c.animaapp.com/eMauf843/img/logo-nouva-fiks-2@2x.png" alt="Logo Nouva">
      <h1>Buat Kata Sandi Baru</h1>
      <p class="desc">Masukkan kata sandi baru untuk akun pelanggan Nouva.</p>
      <form class="login-card" id="resetForm">
        <label for="newPassword">Kata Sandi Baru</label>
        <div class="password-wrap">
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required>
          <button class="toggle-password" type="button" data-toggle="newPassword" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label for="confirmPassword">Konfirmasi Kata Sandi Baru</label>
        <div class="password-wrap">
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Ulangi kata sandi baru" required>
          <button class="toggle-password" type="button" data-toggle="confirmPassword" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button class="btn" id="resetButton" type="submit">Simpan Kata Sandi Baru</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <a class="back-home" href="./login_pelanggan.html">← Kembali ke Login</a>
    </section>
  </main>
  <script>
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('message');
    const btn = document.getElementById('resetButton');
    function showMessage(text, type = 'error') { msg.textContent = text; msg.className = 'message ' + type; }
    document.querySelectorAll('[data-toggle]').forEach(toggle => toggle.addEventListener('click', () => {
      const input = document.getElementById(toggle.dataset.toggle);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
      toggle.classList.toggle('is-visible', show);
    }));
    // Pulihkan sesi dari tautan email Supabase (PKCE ?code=... atau token pada hash).
    async function restoreRecoverySession() {
      if (!window.nouvaSupabaseReady) return;
      const url = new URL(window.location.href);
      const hash = new URLSearchParams(url.hash.replace(/^#/, ''));
      const code = url.searchParams.get('code');
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const recoveryError = hash.get('error_description') || url.searchParams.get('error_description');
      if (recoveryError) { showMessage(decodeURIComponent(recoveryError.replace(/\+/g, ' '))); return; }
      try {
        if (code) {
          const { error } = await window.nouvaSupabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
          url.searchParams.delete('code');
          window.history.replaceState({}, document.title, url.pathname + (url.search ? url.search : '') + url.hash);
        } else if (accessToken && refreshToken) {
          const { error } = await window.nouvaSupabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          if (error) throw error;
          window.history.replaceState({}, document.title, url.pathname + url.search);
        }
      } catch (error) { showMessage('Tautan reset tidak valid atau sudah kedaluwarsa. Kembali ke login dan minta tautan baru.'); }
    }
    restoreRecoverySession();

    form.addEventListener('submit', async event => {
      event.preventDefault();
      showMessage('');
      if (!window.nouvaSupabaseReady) { showMessage('Supabase belum dikonfigurasi. Periksa js/nouva-config.js.'); return; }
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password.length < 6) { showMessage('Kata sandi minimal 6 karakter.'); return; }
      if (password !== confirm) { showMessage('Konfirmasi kata sandi belum sama.'); return; }
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      try {
        const { data: sessionData, error: sessionError } = await window.nouvaSupabase.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) throw new Error('Tautan reset tidak valid atau sudah kedaluwarsa. Pastikan URL halaman reset diizinkan pada Supabase, lalu minta tautan baru dari halaman login.');
        const { error } = await window.nouvaSupabase.auth.updateUser({ password });
        if (error) throw error;
        showMessage('Kata sandi berhasil diperbarui. Silakan login menggunakan kata sandi baru.', 'success');
        form.reset();
        setTimeout(() => { window.location.href = './login_pelanggan.html?reset=success'; }, 1800);
      } catch (error) {
        showMessage(error.message || 'Kata sandi belum dapat diperbarui. Minta tautan reset baru lalu coba lagi.');
      } finally {
        btn.disabled = false; btn.textContent = 'Simpan Kata Sandi Baru';
      }
    });
  </script>
</body>
</html>
