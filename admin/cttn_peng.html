<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengeluaran | NOUVA</title>
  <link rel="stylesheet" href="../globals.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-finance.js"></script>
  <link rel="stylesheet" href="../css/cttn_peng.css">
</head>
<body>
<main class="pengeluaran-page">

  <!-- SIDEBAR SAMA DENGAN HALAMAN PEMBUKUAN -->
  <aside class="sidebar">
    <div class="brand">
      <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
      <div class="brand-name">NOUVA</div>
      <div class="brand-tagline">NOU Menuju Inovasi</div>
    </div>

    <div class="admin-profile">
      <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
      <div class="admin-name">Admin</div>
    </div>

    <nav class="menu" aria-label="Menu aplikasi">
      <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
      <a class="menu-link" href="pesanan.html">
        <img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt="">
        <span>Pesanan</span>
      </a>
      <a class="menu-link" href="produksi.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt="">
        <span>Produksi Jahit</span>
      </a>
      <a class="menu-link" href="produk.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt="">
        <span>Produk</span>
      </a>
      <a class="menu-link" href="pemasaran.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt="">
        <span>Pemasaran</span>
      </a>
      <a class="menu-link active" href="pembukuan.html" aria-current="page">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt="">
        <span>Pembukuan</span>
      </a>
      <a class="menu-link" href="pengaturan.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt="">
        <span>Pengaturan</span>
      </a>
    </nav>
  </aside>

  <section class="main-content">

    <header class="page-header">
      <div class="breadcrumb">
        <a href="pembukuan.html">Pembukuan</a>
        <span>›</span>
        <strong>Pengeluaran</strong>
      </div>
    </header>

    <section class="filter-row">
      <div class="date-range-box">
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateStart" aria-label="Pilih tanggal mulai">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateStartDisplay" class="date-display" type="text" value="28/08/2026" readonly aria-label="Tanggal mulai">
          <input id="dateStart" class="date-picker-hidden" type="date" value="2026-08-28" aria-label="Tanggal mulai">
        </div>
        <span class="range-dash">–</span>
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateEnd" aria-label="Pilih tanggal akhir">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateEndDisplay" class="date-display" type="text" value="30/08/2026" readonly aria-label="Tanggal akhir">
          <input id="dateEnd" class="date-picker-hidden" type="date" value="2026-08-30" aria-label="Tanggal akhir">
        </div>
      </div>

      <button class="add-expense-btn" id="openExpenseModal" type="button">
        <span>＋</span> Catat Pengeluaran
      </button>
    </section>

    <section class="expense-panel">
      <div class="table-wrap">
        <table class="expense-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Transaksi</th>
              <th>Keterangan</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>

      </div>

      <div class="table-footer">
        <strong>Total Pengeluaran</strong>
        <strong id="totalExpensePage">Rp 0</strong>
      </div>
    </section>

    <div class="back-below-table">
      <a class="back-expense-btn" href="pembukuan.html">← Kembali</a>
    </div>

  </section>
</main>

<!-- MODAL CATAT PEMASUKAN -->
<div class="modal" id="expenseModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-heading">
      <div>
        <h2>Catat Pengeluaran</h2>
        <p>Tambahkan transaksi pengeluaran baru.</p>
      </div>
      <button class="close-btn" id="closeExpenseModal" type="button">×</button>
    </div>

    <form id="expenseForm">
      <div class="form-grid">
        <label>
          Tanggal
          <input id="expenseDate" type="date" required>
        </label>

        <label>
          Keterangan
          <input id="expenseCategory" type="text" placeholder="Contoh: Jasa Penjahit" required>
        </label>

        <label class="full">
          Transaksi
          <input id="expenseDescription" type="text" value="Pembelian" readonly>
        </label>

        <label class="full">
          Nominal
          <input id="expenseAmount" type="number" min="0" step="1000" placeholder="1250000" required>
        </label>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelExpense" type="button">Batal</button>
        <button class="save-btn" type="submit">Simpan Pengeluaran</button>
      </div>
    </form>
  </div>
</div>

<script>
const db=window.nouvaFinanceClient, expenseBody=document.getElementById('expenseBody'),totalExpensePage=document.getElementById('totalExpensePage');
const dateStart=document.getElementById('dateStart'),dateEnd=document.getElementById('dateEnd'),modal=document.getElementById('expenseModal'),form=document.getElementById('expenseForm');let expenseRows=[];
const rupiah=v=>'Rp '+Number(v||0).toLocaleString('id-ID');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function fmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';}function fmtInput(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`;}
function syncDates(){document.getElementById('dateStartDisplay').value=fmtInput(dateStart.value);document.getElementById('dateEndDisplay').value=fmtInput(dateEnd.value);}function keepRange(changed){if(dateStart.value&&dateEnd.value&&dateEnd.value<dateStart.value){if(changed===dateStart)dateEnd.value=dateStart.value;else dateStart.value=dateEnd.value;}syncDates();}
async function loadExpenses(){if(!db){alert('Supabase belum terhubung. Periksa konfigurasi.');return;}const {data,error}=await db.from('expense_records').select('id,transaction_date,category,description,reference_no,amount,created_at').order('transaction_date',{ascending:false});if(error){alert('Gagal memuat pengeluaran: '+window.nouvaFinanceError(error));return;}expenseRows=(data||[]).map(r=>({id:r.id,date:r.transaction_date,category:r.category,description:r.description,reference:r.reference_no,amount:Number(r.amount||0)}));renderExpenses();}
function renderExpenses(){let rows=expenseRows.filter(r=>(!dateStart.value||r.date>=dateStart.value)&&(!dateEnd.value||r.date<=dateEnd.value));rows.sort((a,b)=>b.date.localeCompare(a.date));expenseBody.innerHTML=rows.length?rows.map(r=>`<tr><td>${fmt(r.date)}</td><td class="transaction-name">${esc(r.description||'-')}</td><td>${esc(r.category||'-')}</td><td class="amount-cell">${rupiah(r.amount)}</td><td>${r.orderId?'<span title="Pemasukan otomatis dari pesanan">—</span>':`<button class="delete-row" type="button" data-id="${r.id}" title="Hapus">×</button>`}</td></tr>`).join(''):`<tr class="empty-row"><td colspan="5">Belum ada data pengeluaran pada periode yang dipilih.</td></tr>`;totalExpensePage.textContent=rupiah(rows.reduce((a,r)=>a+r.amount,0));expenseBody.querySelectorAll('.delete-row').forEach(b=>b.addEventListener('click',()=>deleteExpense(b.dataset.id)));}
async function deleteExpense(id){if(!confirm('Hapus transaksi pengeluaran ini?'))return;const {error}=await db.from('expense_records').delete().eq('id',id);if(error){alert('Gagal menghapus: '+window.nouvaFinanceError(error));return;}await loadExpenses();}
function openModal(){form.reset();document.getElementById('expenseDate').value=new Date().toISOString().slice(0,10);document.getElementById('expenseDescription').value='Pembelian';modal.classList.add('show');modal.setAttribute('aria-hidden','false');}function closeModal(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true');form.reset();}
document.getElementById('openExpenseModal').addEventListener('click',openModal);document.getElementById('closeExpenseModal').addEventListener('click',closeModal);document.getElementById('cancelExpense').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
form.addEventListener('submit',async e=>{e.preventDefault();if(!db){alert('Supabase belum terhubung.');return;}const category=document.getElementById('expenseCategory').value.trim();const payload={transaction_date:document.getElementById('expenseDate').value,category,description:'Pembelian - '+category,amount:Number(document.getElementById('expenseAmount').value)};const {error}=await db.from('expense_records').insert(payload);if(error){alert('Gagal menyimpan pengeluaran: '+window.nouvaFinanceError(error));return;}closeModal();await loadExpenses();});
dateStart.addEventListener('change',()=>{keepRange(dateStart);renderExpenses();});dateEnd.addEventListener('change',()=>{keepRange(dateEnd);renderExpenses();});document.querySelectorAll('.calendar-button').forEach(b=>b.addEventListener('click',()=>{const p=document.getElementById(b.dataset.picker);if(p?.showPicker)p.showPicker();else p?.click();}));const today=new Date(),todayKey=today.toISOString().slice(0,10),monthStart=todayKey.slice(0,8)+'01';dateStart.value=monthStart;dateEnd.value=todayKey;syncDates();loadExpenses();
</script>
</body>
</html>
