    <div class="admin-profile">

      <div class="admin-name">Admin</div>
    </div>

    <nav class="menu" aria-label="Menu aplikasi">
      <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
      <a class="menu-link" href="pesanan.html">
        <img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt="">
        <span>Pesanan</span>
      </a>
      <a class="menu-link" href="produksi.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt="">
        <span>Produksi Jahit</span>
      </a>
      <a class="menu-link" href="produk.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt="">
        <span>Produk</span>
      </a>
      <a class="menu-link" href="pemasaran.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt="">
        <span>Pemasaran</span>
      </a>
      <a class="menu-link active" href="pembukuan.html" aria-current="page">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt="">
        <span>Pembukuan</span>
      </a>
      <a class="menu-link" href="pengaturan.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt="">
        <span>Pengaturan</span>
      </a>
    </nav>
  </aside>

  <section class="main-content">

    <header class="page-header">
      <div class="breadcrumb">
        <a href="pembukuan.html">Pembukuan</a>
        <span>›</span>
        <strong>Pengeluaran</strong>
      </div>
    </header>

    <section class="filter-row">
      <div class="date-range-box">
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateStart" aria-label="Pilih tanggal mulai">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateStartDisplay" class="date-display" type="text" value="28/08/2026" readonly aria-label="Tanggal mulai">
          <input id="dateStart" class="date-picker-hidden" type="date" value="2026-08-28" aria-label="Tanggal mulai">
        </div>
        <span class="range-dash">–</span>
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateEnd" aria-label="Pilih tanggal akhir">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateEndDisplay" class="date-display" type="text" value="30/08/2026" readonly aria-label="Tanggal akhir">
          <input id="dateEnd" class="date-picker-hidden" type="date" value="2026-08-30" aria-label="Tanggal akhir">
        </div>
      </div>

      <button class="add-expense-btn" id="openExpenseModal" type="button">
        <span>＋</span> Catat Pengeluaran
      </button>
    </section>

    <section class="expense-panel">
      <div class="table-wrap">
        <table class="expense-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Transaksi</th>
              <th>Keterangan</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>

      </div>

      <div class="table-footer">
        <strong>Total Pengeluaran</strong>
        <strong id="totalExpensePage">Rp 0</strong>
      </div>
    </section>

    <div class="back-below-table">
      <a class="back-expense-btn" href="pembukuan.html">← Kembali</a>
    </div>

  </section>
</main>

<!-- MODAL CATAT PEMASUKAN -->
<div class="modal" id="expenseModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-heading">
      <div>
        <h2>Catat Pengeluaran</h2>
        <p>Tambahkan transaksi pengeluaran baru.</p>
      </div>
      <button class="close-btn" id="closeExpenseModal" type="button">×</button>
    </div>

    <form id="expenseForm">
      <div class="form-grid">
        <label>
          Tanggal
          <input id="expenseDate" type="date" required>
        </label>

        <label>
          Keterangan
          <input id="expenseCategory" type="text" placeholder="Contoh: Jasa Penjahit" required>
        </label>

        <label class="full">
          Transaksi
          <input id="expenseDescription" type="text" value="Pembelian" readonly>
        </label>

        <label class="full">
          Nominal
          <input id="expenseAmount" type="number" min="0" step="1000" placeholder="1250000" required>
        </label>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelExpense" type="button">Batal</button>
        <button class="save-btn" type="submit">Simpan Pengeluaran</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'nouvaTransactions';

const expenseBody = document.getElementById('expenseBody');
const totalExpensePage = document.getElementById('totalExpensePage');
const dateStart = document.getElementById('dateStart');
const dateEnd = document.getElementById('dateEnd');

const modal = document.getElementById('expenseModal');
const form = document.getElementById('expenseForm');

function getTransactions() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

function saveTransactions(rows) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
}

// Format yang dipakai pada kolom Keterangan di halaman Pembukuan.
function getExpenseLabel(transaction) {
  const category = String(transaction.category || '').toUpperCase();
  const prefix = category === 'DISPLAY' ? 'DIS' : 'CUS';
  const reference = String(transaction.reference || '000-000').trim() || '000-000';
  return `Pembelian - ${transaction.category || '-'}`;
}

function rupiah(value) {
  return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
}

function formatDate(dateString) {
  if (!dateString) return '-';
  return new Date(dateString + 'T00:00:00').toLocaleDateString('id-ID', {
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  });
}

function formatDateInput(dateString) {
  if (!dateString) return '';
  const [year, month, day] = dateString.split('-');
  return `${day}/${month}/${year}`;
}

function syncDateDisplays() {
  document.getElementById('dateStartDisplay').value = formatDateInput(dateStart.value);
  document.getElementById('dateEndDisplay').value = formatDateInput(dateEnd.value);
}

function keepDateRangeValid(changedInput) {
  if (dateStart.value && dateEnd.value && dateEnd.value < dateStart.value) {
    if (changedInput === dateStart) {
      dateEnd.value = dateStart.value;
    } else {
      dateStart.value = dateEnd.value;
    }
  }
  syncDateDisplays();
}

function renderExpenseTable() {
  const start = dateStart.value;
  const end = dateEnd.value;
  let rows = getTransactions().filter(t => t.type === 'expense');

  if (start) rows = rows.filter(t => t.date >= start);
  if (end) rows = rows.filter(t => t.date <= end);
  rows.sort((a, b) => b.date.localeCompare(a.date));

  if (rows.length === 0) {
    expenseBody.innerHTML = `
      <tr class="empty-row">
        <td colspan="5">Belum ada data pengeluaran pada periode yang dipilih.</td>
      </tr>
    `;
  } else {
    expenseBody.innerHTML = rows.map((t, index) => `
      <tr>
        <td>${formatDate(t.date)}</td>
        <td class="transaction-name">${escapeHtml(t.description || '-')}</td>
        <td>${escapeHtml(t.category || '-')}</td>
        <td class="amount-cell">${rupiah(t.amount)}</td>
        <td>
          <button class="delete-row" type="button" data-index="${index}" title="Hapus">×</button>
        </td>
      </tr>
    `).join('');
  }


  const total = rows.reduce((sum, t) => sum + Number(t.amount || 0), 0);
  totalExpensePage.textContent = rupiah(total);

  expenseBody.querySelectorAll('.delete-row').forEach((button, index) => {
    button.addEventListener('click', () => deleteExpense(rows[index]));
  });
}

function deleteExpense(target) {
  const all = getTransactions();
  const index = all.findIndex(t =>
    t === target ||
    (t.date === target.date &&
     t.description === target.description &&
     t.type === target.type &&
     Number(t.amount) === Number(target.amount) &&
     (t.reference || '') === (target.reference || ''))
  );

  if (index === -1) return;

  if (confirm('Hapus transaksi pengeluaran ini?')) {
    all.splice(index, 1);
    saveTransactions(all);
    renderExpenseTable();
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function openModal() {
  document.getElementById('expenseDate').value =
    new Date().toISOString().slice(0, 10);
  form.reset();
  document.getElementById('expenseDate').value =
    new Date().toISOString().slice(0, 10);
  document.getElementById('expenseDescription').value = 'Pembelian';
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  form.reset();
}

document.getElementById('openExpenseModal').addEventListener('click', openModal);
document.getElementById('closeExpenseModal').addEventListener('click', closeModal);
document.getElementById('cancelExpense').addEventListener('click', closeModal);

modal.addEventListener('click', event => {
  if (event.target === modal) closeModal();
});

form.addEventListener('submit', event => {
  event.preventDefault();

  const transactions = getTransactions();

  const category = document.getElementById('expenseCategory').value;

  const transaction = {
    date: document.getElementById('expenseDate').value,
    // Kolom Keterangan di Pembukuan otomatis menjadi:
    // Pembelian - (isi keterangan dari form)
    description: `Pembelian - ${category}`,
    type: 'expense',
    category,
    amount: Number(document.getElementById('expenseAmount').value),
    createdAt: Date.now()
  };

  transaction.accountingLabel = getExpenseLabel(transaction);
  transactions.push(transaction);

  saveTransactions(transactions);
  closeModal();
  renderExpenseTable();
});

dateStart.addEventListener('change', () => {
  keepDateRangeValid(dateStart);
  renderExpenseTable();
});

dateEnd.addEventListener('change', () => {
  keepDateRangeValid(dateEnd);
  renderExpenseTable();
});

document.querySelectorAll('.calendar-button').forEach(button => {
  button.addEventListener('click', () => {
    const picker = document.getElementById(button.dataset.picker);
    if (picker && typeof picker.showPicker === 'function') {
      picker.showPicker();
    } else if (picker) {
      picker.click();
    }
  });
});

syncDateDisplays();
renderExpenseTable();
</script>
</body>
</html>
