<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Produk - Uti Karawo</title>
<link rel="stylesheet" href="../globals.css">
<link rel="stylesheet" href="../css/produk.css">
</head>
<body>
<div class="dashboard-admin">
<aside class="sidebar">
    <div class="brand">
      <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
      <div class="brand-name">NOUVA</div>
      <div class="brand-tagline">NOU Menuju Inovasi</div>
    </div>

    <div class="admin-profile">
      <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
      <div class="admin-name">Admin</div>
    </div>

    <nav class="menu" aria-label="Menu aplikasi">
      <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
        <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
        <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
        <span>Dashboard</span>
      </a>
      <a class="menu-link" href="pesanan.html"><img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt=""><span>Pesanan</span></a>
      <a class="menu-link" href="produksi.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt=""><span>Produksi Jahit</span></a>
      <a class="menu-link active" href="produk.html" aria-current="page"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt=""><span>Produk</span></a>
      <a class="menu-link" href="pemasaran.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt=""><span>Pemasaran</span></a>
      <a class="menu-link" href="pembukuan.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt=""><span>Pembukuan</span></a>
      <a class="menu-link" href="pengaturan.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt=""><span>Pengaturan</span></a>
    </nav>
  </aside>
<main class="main-content produk-content">
  <header class="header">
    <div class="welcome">
      <h1>Daftar Produk</h1>
      <p>Kelola produk yang tersedia di UtiKarawo</p>
    </div>
  </header>

  <section class="products-panel">
    <div class="toolbar">
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.2 16.2 4.3 4.3"></path></svg>
        <input id="searchInput" type="search" placeholder="Cari nama produk, motif, atau warna..." aria-label="Cari produk">
      </label>
      <button class="add-product-btn" type="button" onclick="window.location.href='tambah_produk.html'"><span>＋</span> Tambah Produk</button>
    </div>

    <div id="productGrid" class="product-grid" aria-live="polite"><p class="loading-products">Memuat produk dari database...</p></div>

    <div class="list-footer">
      <span id="resultCount">Menampilkan 1–8 dari 20 produk</span>
      <div class="pagination" aria-label="Paginasi produk">
        <button type="button" class="page-btn active" data-page="1">1</button>
        <button type="button" class="page-btn" data-page="2">2</button>
        <button type="button" class="page-btn" data-page="3">3</button>
      </div>
    </div>
  </section>
</main>
</div>

<div class="product-menu" id="productMenu">
  <button type="button" onclick="editProduct()">Edit Produk</button>
  <button type="button" id="toggleActiveBtn" onclick="toggleProductActive()">Nonaktifkan Produk</button>
</div>

<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <button class="modal-close" type="button" onclick="closeAddModal()">×</button>
    <h2>Tambah Produk</h2>
    <p>Tambahkan produk pakaian baru ke katalog.</p>
    <div class="form-grid">
      <label>Nama Produk<input id="newName" placeholder="Contoh: Kemeja Karawo"></label>
      <label>Harga<input id="newPrice" placeholder="Rp 450.000"></label>
      <label>Stok<input id="newStock" placeholder="50 pcs"></label>
      <label>Motif / Warna<input id="newColor" placeholder="Ungu, putih"></label>
    </div>
    <button class="save-btn" type="button" onclick="saveNewProduct()">Simpan Produk</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/nouva-config.js"></script><script src="../js/nouva-supabase.js"></script><script src="../js/nouva-workflow.js"></script>
<script>
const grid=document.getElementById("productGrid"), searchInput=document.getElementById("searchInput"), resultCount=document.getElementById("resultCount");
const pageButtons=[...document.querySelectorAll(".page-btn")], pageSize=20;
let products=[],filtered=[],currentPage=1,selectedProduct=null;
const money=v=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(v||0));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function sb(){if(!window.nouvaSupabaseReady||!window.nouvaSupabase)throw Error("Koneksi Supabase belum siap. Periksa js/nouva-config.js.");return window.nouvaSupabase;}
async function verifyAdmin(){
 const client=sb(),{data:{session}}=await client.auth.getSession();
 if(!session){alert("Silakan login sebagai admin terlebih dahulu.");location.href="../auth/login_admin.html";throw Error("Belum login");}
 const {data:p,error}=await client.from("profiles").select("role,full_name").eq("id",session.user.id).single();
 if(error||p?.role!=="admin"){await client.auth.signOut();alert("Halaman ini khusus admin.");location.href="../auth/login_admin.html";throw Error("Bukan admin");}
 if(p.full_name)document.querySelector(".admin-name").textContent=p.full_name;
}
async function loadProducts(){
 grid.innerHTML='<p class="loading-products">Memuat produk...</p>';
 try{
  const {data,error}=await sb().from("products").select("id,reference_no,name,category,description,fabric_type,motif_name,motif_image_url,price,is_active,created_at,product_images(image_url,sort_order),product_variants(id,size,color_name,color_image_url,stock)").order("created_at",{ascending:false});
  if(error)throw error;
  products=(data||[]).map(p=>({...p,image:(p.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order)[0]?.image_url||p.motif_image_url||"",variants:p.product_variants||[],stock:(p.product_variants||[]).reduce((n,v)=>n+Number(v.stock||0),0),colors:[...new Set((p.product_variants||[]).map(v=>v.color_name).filter(Boolean))]}));
  filtered=products;renderProducts();
 }catch(e){grid.innerHTML=`<div class="empty-products"><b>Produk belum bisa dimuat.</b><p>${esc(e.message||"Periksa koneksi database.")}</p><button onclick="loadProducts()">Coba lagi</button></div>`;resultCount.textContent="Data produk tidak tersedia";}
}
function renderProducts(){
 const total=filtered.length,pages=Math.max(1,Math.ceil(total/pageSize));currentPage=Math.min(currentPage,pages);
 const start=(currentPage-1)*pageSize,shown=filtered.slice(start,start+pageSize);
 grid.innerHTML=shown.length?shown.map(p=>`<article class="product-card ${p.is_active?"":"product-inactive"}" data-id="${esc(p.id)}"><div class="product-image ${p.image?'':'fallback'}">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.closest('.product-image').classList.add('fallback');this.remove()">`:''}<button class="more-btn" type="button" aria-label="Kelola ${esc(p.name)}" data-menu-id="${esc(p.id)}">⋮</button></div><div class="product-info"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="stock"><span></span> Stok: ${p.stock} pcs</div><div class="colors">${p.colors.slice(0,5).map((c,i)=>`<i title="${esc(c)}" style="background:${colorHex(c,i)}"></i>`).join("")}</div><small class="product-ref">${esc(p.reference_no||"")} · ${p.is_active?"Aktif":"Nonaktif"}</small></div></article>`).join(""):'<div class="empty-products">Belum ada produk aktif. Tekan <b>Tambah Produk</b> untuk mulai.</div>';
 pageButtons.forEach((b,i)=>{b.style.display=i<pages?"grid":"none";b.classList.toggle("active",Number(b.dataset.page)===currentPage);});
 resultCount.textContent=`Menampilkan ${total?start+1:0}–${Math.min(start+pageSize,total)} dari ${total} produk`;
 grid.querySelectorAll("[data-menu-id]").forEach(btn=>btn.addEventListener("click",e=>openProductMenu(e,btn.dataset.menuId)));
}
function colorHex(name,i){const c={"hitam":"#222","putih":"#fff","merah":"#c94c55","biru":"#426aab","navy":"#203a70","hijau":"#438267","ungu":"#8051a7","pink":"#e6a4bd","krem":"#e8dfcf","cokelat":"#87634e","olive":"#77794a","abu-abu":"#aaa"};return c[String(name||"").toLowerCase()]||["#8051a7","#d8c4e2","#e8dfcf","#6c8a72","#426aab"][i%5];}
function filterProducts(){const q=searchInput.value.trim().toLowerCase();filtered=products.filter(p=>[p.name,p.category,p.motif_name,p.fabric_type,...p.colors].join(" ").toLowerCase().includes(q));currentPage=1;renderProducts();}
searchInput.addEventListener("input",filterProducts);pageButtons.forEach(b=>b.addEventListener("click",()=>{currentPage=Number(b.dataset.page);renderProducts();}));
function openProductMenu(e,id){e.stopPropagation();selectedProduct=products.find(p=>p.id===id);document.getElementById("toggleActiveBtn").textContent=selectedProduct?.is_active?"Nonaktifkan Produk":"Aktifkan Produk";const m=document.getElementById("productMenu"),r=e.currentTarget.getBoundingClientRect();m.style.left=`${Math.max(8,Math.min(r.left,innerWidth-170))}px`;m.style.top=`${Math.max(8,Math.min(r.bottom+6,innerHeight-90))}px`;m.classList.add("show");}
document.addEventListener("click",()=>document.getElementById("productMenu").classList.remove("show"));
function editProduct(){if(!selectedProduct)return;localStorage.setItem("editProductId",selectedProduct.id);location.href="edit_dis.html?id="+encodeURIComponent(selectedProduct.id);}
async function toggleProductActive(){if(!selectedProduct)return;const p=selectedProduct;const next=!p.is_active;const verb=next?"aktifkan":"nonaktifkan";if(!confirm(`${next?"Aktifkan kembali":"Nonaktifkan"} "${p.name}"?`))return;try{const {error}=await sb().from("products").update({is_active:next,updated_at:new Date().toISOString()}).eq("id",p.id);if(error)throw error;alert(`Produk berhasil ${next?"diaktifkan":"dinonaktifkan"}.`);document.getElementById("productMenu").classList.remove("show");await loadProducts();}catch(e){alert("Gagal: "+e.message);}}
document.querySelector(".add-product-btn").addEventListener("click",()=>location.href="tambah_produk.html");
verifyAdmin().then(loadProducts).catch(()=>{});
</script>
</body>
</html>
