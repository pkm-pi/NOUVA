<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Produk - Uti Karawo</title>
  <link rel="stylesheet" href="../globals.css">
  <link rel="stylesheet" href="../css/edit_dis.css">
  <style>
    /* Pastikan aturan CSS grid form tidak mengalahkan atribut hidden. */
    #editLayout[hidden], #editLoading[hidden] { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-supabase.js"></script>
  <script src="../js/nouva-cloudinary.js"></script>
  <script src="../js/nouva-workflow.js"></script>
</head>
<body>
  <div class="dashboard-admin">

    <!-- SIDEBAR: sengaja mengikuti struktur produk.html -->
    <aside class="sidebar">
      <div class="brand">
        <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
        <div class="brand-name">NOUVA</div>
        <div class="brand-tagline">NOU Menuju Inovasi</div>
      </div>

      <div class="admin-profile">
        <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
        <div class="admin-name">Admin</div>
      </div>

      <nav class="menu" aria-label="Menu aplikasi">
        <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
        <a class="menu-link" href="pesanan.html">
          <img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt="">
          <span>Pesanan</span>
        </a>
        <a class="menu-link" href="produksi.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt="">
          <span>Produksi Jahit</span>
        </a>
        <a class="menu-link active" href="produk.html" aria-current="page">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt="">
          <span>Produk</span>
        </a>
        <a class="menu-link" href="pemasaran.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt="">
          <span>Pemasaran</span>
        </a>
        <a class="menu-link" href="pembukuan.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt="">
          <span>Pembukuan</span>
        </a>
        <a class="menu-link" href="pengaturan.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt="">
          <span>Pengaturan</span>
        </a>
      </nav>
    </aside>

    <main class="main-content edit-content">
      <header class="header" aria-label="Navigasi halaman"></header>

      <section class="edit-heading">
        <a class="title-icon back-title-button" href="produk.html" aria-label="Kembali ke daftar produk" title="Kembali ke daftar produk"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M12 19l-7-7 7-7" /></svg></a>
        <div>
          <h1>Edit Produk</h1>
          <p>Perbarui informasi produk sesuai kebutuhan.</p>
        </div>
      </section>

      <div id="editLoading" role="status" aria-live="polite" style="margin:18px 0;padding:28px 20px;border:1px solid #e8dcef;border-radius:14px;background:#fff;text-align:center;color:#6f3a80;font-weight:600;">
        Memuat data produk...
      </div>
      <div class="edit-layout" id="editLayout" hidden>
      <section class="edit-panel">
        <div class="form-main">

          <div class="product-media">
            <div class="photo-label">Foto Utama</div>
            <label class="main-photo edit-main-photo">
              <input type="file" accept="image/*" class="hidden-file" data-photo="main">
              <img id="mainProductImage" src="https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=900&q=85" alt="Foto utama produk">
            </label>

            <div class="thumbnail-list" aria-label="Foto produk">
              <label class="thumb active edit-thumb">
                <input type="file" accept="image/*" class="hidden-file" data-photo="main-thumb">
                <img class="thumb-image" data-thumb-index="0" src="https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=300&q=80" alt="Foto utama">
              </label>
              <label class="thumb edit-thumb">
                <input type="file" accept="image/*" class="hidden-file" data-photo="extra">
                <img class="thumb-image" data-thumb-index="1" src="https://images.unsplash.com/photo-1603252110481-7ba873bf42ab?auto=format&fit=crop&w=300&q=80" alt="Foto tambahan">
              </label>
              <label class="thumb edit-thumb">
                <input type="file" accept="image/*" class="hidden-file" data-photo="extra">
                <img class="thumb-image" data-thumb-index="2" src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=300&q=80" alt="Foto tambahan">
              </label>
              <label class="thumb edit-thumb">
                <input type="file" accept="image/*" class="hidden-file" data-photo="extra">
                <img class="thumb-image" data-thumb-index="3" src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=300&q=80" alt="Foto tambahan">
              </label>
            </div>
          </div>

          <form class="product-form" id="editProductForm">
            <div class="field full">
              <label for="productName">Nama Produk</label>
              <input id="productName" name="productName" value="" type="text">
            </div>

            <div class="field">
              <label for="category">Kategori Produk</label>
              <select id="category" name="category">
                <option selected disabled>Pilih Kategori</option>
                <option>Kemeja</option><option>Blouse</option><option>Jas</option><option>Dress</option><option>Atasan</option><option>Lainnya</option>
              </select>
            </div>

            <div class="field">
              <label>Motif Sulaman Produk</label>
              <div class="motif-box">
                <label class="motif-image upload-color"><input id="motifImage" type="file" accept="image/*" class="hidden-file"><span>＋</span><small>Foto Motif</small></label>
                <input id="motifName" name="motifName" type="text" placeholder="Nama motif sulaman">
              </div>
            </div>

            <div class="field-grid two">
              <div class="field">
                <label for="price">Harga</label>
                <input id="price" name="price" value="" type="text">
              </div>
              <div class="field">
                <label for="stock">Stok</label>
                <div class="input-suffix">
                  <input id="stock" name="stock" value="" type="number" min="0">
                  <span>pcs</span>
                </div>
              </div>
            </div>

            <div class="field">
              <label>Warna Kain</label>
              <div class="fabric-color-single">
                <label class="color-image upload-color"><input id="fabricColorImage" type="file" accept="image/*" class="hidden-file"><span>＋</span><small>Foto Kain</small></label>
                <input id="fabricColorName" name="fabricColorName" type="text" class="color-name-input" placeholder="Nama warna kain">
              </div>
            </div>

            <div class="field-grid two size-fabric-row">
              <div class="field">
                <label>Ukuran Tersedia</label>
                <div class="size-row">
                  <button class="size-btn" type="button">S</button>
                  <button class="size-btn" type="button">M</button>
                  <button class="size-btn" type="button">L</button>
                  <button class="size-btn" type="button">XL</button>
                </div>
              </div>

              <div class="field">
                <label for="jenisKain">Jenis Kain</label>
                <input id="jenisKain" type="text" placeholder="Contoh: Katun, Sutra, Wol">
              </div>
            </div>


            <div class="field full description-field">
              <div class="label-row">
                <label for="description">Deskripsi</label>
                <span id="descriptionCount">0/500</span>
              </div>
              <textarea id="description" name="description" maxlength="500" placeholder="Masukkan deskripsi produk..."></textarea>
            </div>
          </form>
        </div>

        <div class="edit-footer">
          <div class="last-updated">
            <span class="info-icon">i</span>
            <div>
              <strong>Terakhir diperbarui</strong>
              <small id="lastUpdated">12 Juni 2025, 10:24 oleh Admin</small>
            </div>
          </div>
          <div class="footer-actions">
            <button class="cancel-btn" type="button">Batal</button>
            <button class="save-btn" type="button" onclick="document.getElementById('editProductForm').requestSubmit()">
              <span aria-hidden="true">▣</span> Simpan Perubahan
            </button>
          </div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <script>
(async function(){
 const $=id=>document.getElementById(id), sb=window.nouvaSupabase, esc=NouvaWorkflow.escape;
 let auth, product, variants=[], oldImages=[];
 const params=new URLSearchParams(location.search);
 const productId=params.get("id")||localStorage.getItem("editProductId");
 function msg(text){let el=$("editStatus");if(!el){el=document.createElement("p");el.id="editStatus";el.style.cssText="padding:10px;border-radius:8px;background:#f8f1fa;color:#391e46;font-size:13px";$("editProductForm").prepend(el)}el.textContent=text}
 try{
  auth=await NouvaWorkflow.requireRole("admin","../auth/login_admin.html");
  if(!productId)throw new Error("ID produk tidak ditemukan. Buka menu titik tiga pada produk lalu pilih Edit.");
  const {data,error}=await sb.from("products").select("*,product_images(id,image_url,sort_order),product_variants(id,size,color_name,color_image_url,stock)").eq("id",productId).single();
  if(error)throw error;product=data;variants=data.product_variants||[];oldImages=(data.product_images||[]).sort((a,b)=>a.sort_order-b.sort_order);
  $("productName").value=data.name||"";$("price").value=Number(data.price||0);
  $("stock").value=variants.length?Math.max(...variants.map(v=>Number(v.stock)||0)):0;
  $("motifName").value=data.motif_name||"";$("fabricColorName").value=variants[0]?.color_name||"";
  $("jenisKain").value=data.fabric_type||"";$("description").value=data.description||"";
  if(data.category){const opt=[...$("category").options].find(o=>o.value===data.category||o.textContent.trim()===data.category);if(opt)$("category").value=opt.value;}
  const selectedSizes=variants.map(v=>v.size);
  document.querySelectorAll(".size-btn").forEach(b=>b.classList.toggle("selected",selectedSizes.includes(b.textContent.trim())));
  const main=oldImages[0]?.image_url||data.motif_image_url;
  if(main)$("mainProductImage").src=main;
  oldImages.forEach((im,i)=>{const el=document.querySelector(`.thumb-image[data-thumb-index="${i}"]`);if(el)el.src=im.image_url});
  if(data.motif_image_url){const p=$("motifImage").parentElement;p.style.backgroundImage=`url("${data.motif_image_url}")`;p.style.backgroundSize="cover"}
  if(variants[0]?.color_image_url){const p=$("fabricColorImage").parentElement;p.style.backgroundImage=`url("${variants[0].color_image_url}")`;p.style.backgroundSize="cover"}
  $("lastUpdated").textContent=data.updated_at?new Date(data.updated_at).toLocaleString("id-ID"):"—";
  // Tampilkan form hanya setelah data produk selesai dimuat dan semua input terisi.
  $("editLoading").hidden=true;
  $("editLayout").hidden=false;
 }catch(e){
  console.error("Gagal memuat data produk:",e);
  const loading=$("editLoading");
  loading.textContent="Data produk gagal dimuat: "+(e.message||String(e))+". Periksa koneksi dan akses admin, lalu muat ulang halaman.";
  loading.style.color="#a12626";
  return
 }
 function preview(input){const file=input.files?.[0];if(!file)return;const url=URL.createObjectURL(file);if(input.dataset.photo==="main"||input.dataset.photo==="main-thumb")$("mainProductImage").src=url;const im=input.closest(".thumb")?.querySelector("img");if(im)im.src=url;else if(input.id==="motifImage"||input.id==="fabricColorImage"){input.parentElement.style.backgroundImage=`url("${url}")`;input.parentElement.style.backgroundSize="cover"}}
 document.querySelectorAll("[data-photo],.upload-color input").forEach(i=>i.addEventListener("change",()=>preview(i)));
 document.querySelectorAll(".thumb").forEach(b=>b.addEventListener("click",e=>{if(e.target.closest("input"))return;document.querySelectorAll(".thumb").forEach(x=>x.classList.toggle("active",x===b));const im=b.querySelector("img");if(im?.src)$("mainProductImage").src=im.src}));
 document.querySelectorAll(".size-btn").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("selected")));
 $("description").addEventListener("input",()=>$("descriptionCount").textContent=`${$("description").value.length}/500`);
 $("cancelEditBtn")?.addEventListener("click",()=>location.href="produk.html");
 document.querySelector(".cancel-btn")?.addEventListener("click",e=>{e.preventDefault();location.href="produk.html"});
 $("editProductForm").addEventListener("submit",async e=>{
  e.preventDefault();const submit=$("editProductForm").querySelector('[type="submit"]');if(submit)submit.disabled=true;
  try{
   const name=$("productName").value.trim(),price=Number($("price").value),category=$("category").value;
   const color=$("fabricColorName").value.trim()||"Warna utama",stock=Math.max(0,parseInt($("stock").value,10)||0);
   const sizes=[...document.querySelectorAll(".size-btn.selected")].map(b=>b.textContent.trim());
   if(!name||!category||!Number.isFinite(price)||price<0||!sizes.length)throw new Error("Nama, kategori, harga valid, dan minimal satu ukuran wajib diisi.");
   msg("Menyimpan perubahan...");
   let mainUrl=oldImages[0]?.image_url||product.motif_image_url||null;
   const mainInput=document.querySelector('[data-photo="main"]');
   if(mainInput?.files?.[0])mainUrl=(await window.nouvaUploadImage(mainInput.files[0],"nouva/products")).url;
   const motifInput=$("motifImage");
   let motifUrl=product.motif_image_url||null;
   if(motifInput?.files?.[0])motifUrl=(await window.nouvaUploadImage(motifInput.files[0],"nouva/motifs")).url;
   const productPayload={name,price,category,description:$("description").value.trim(),fabric_type:$("jenisKain").value.trim()||null,motif_name:$("motifName").value.trim()||null,motif_image_url:motifUrl,updated_at:new Date().toISOString()};
   // Supabase dapat mengembalikan tanpa error tetapi 0 baris berubah bila RLS menolak update.
   const {data:updatedProduct,error:upErr}=await sb.from("products").update(productPayload).eq("id",product.id).select("id,name,price,updated_at").maybeSingle();
   if(upErr)throw upErr;
   if(!updatedProduct)throw new Error("Data produk tidak berubah. Periksa akun admin dan policy RLS tabel products di Supabase, lalu jalankan fix_produk_admin.sql.");
   const colorImageInput=$("fabricColorImage");let colorUrl=variants.find(v=>v.color_name===color)?.color_image_url||null;
   if(colorImageInput?.files?.[0])colorUrl=(await window.nouvaUploadImage(colorImageInput.files[0],"nouva/fabrics")).url;
   if(mainUrl){
     const {error:delErr}=await sb.from("product_images").delete().eq("product_id",product.id);if(delErr)throw delErr;
     const imageRows=[{product_id:product.id,image_url:mainUrl,sort_order:1},...oldImages.slice(1).map((im,i)=>({product_id:product.id,image_url:im.image_url,sort_order:i+2}))];
     const {data:insertedImages,error:imgErr}=await sb.from("product_images").insert(imageRows).select("id");
     if(imgErr)throw imgErr;
     if(!insertedImages||insertedImages.length!==imageRows.length)throw new Error("Foto produk belum terverifikasi tersimpan.");
   }
   for(const size of sizes){
    const existing=variants.find(v=>v.size===size&&v.color_name===color);
    if(existing){const {error}=await sb.from("product_variants").update({stock,color_image_url:colorUrl,updated_at:new Date().toISOString()}).eq("id",existing.id);if(error)throw error}
    else {const {error}=await sb.from("product_variants").insert({product_id:product.id,size,color_name:color,color_image_url:colorUrl,stock});if(error)throw error}
   }
   // Baca ulang dari database sebelum menyatakan sukses agar perubahan yang tidak tersimpan tidak disamarkan.
   const {data:verified,error:verifyErr}=await sb.from("products").select("id,name,price,category,description,fabric_type,motif_name,motif_image_url,updated_at").eq("id",product.id).single();
   if(verifyErr)throw verifyErr;
   if(verified.name!==name || Number(verified.price)!==price || verified.category!==category)throw new Error("Data tersimpan tidak sama dengan isian terbaru. Coba lagi dan periksa policy RLS.");
   alert("Perubahan produk berhasil diverifikasi tersimpan. Halaman daftar produk akan dimuat ulang.");
   location.replace("produk.html?updated="+Date.now());
  }catch(err){console.error(err);msg("Gagal menyimpan: "+(err.message||err));if(submit)submit.disabled=false}
 });
})();
</script>
</body>
</html>
