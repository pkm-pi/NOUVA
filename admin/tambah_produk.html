<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Produk - Uti Karawo</title>
  <link rel="stylesheet" href="../globals.css">
  <link rel="stylesheet" href="../css/tambah_produk.css">
</head>
<body>
  <div class="dashboard-admin">

    <!-- SIDEBAR: sengaja mengikuti struktur produk.html -->
    <aside class="sidebar">
      <div class="brand">
        <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
        <div class="brand-name">NOUVA</div>
        <div class="brand-tagline">NOU Menuju Inovasi</div>
      </div>

      <div class="admin-profile">
        <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
        <div class="admin-name">Admin</div>
      </div>

      <nav class="menu" aria-label="Menu aplikasi">
        <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
        <a class="menu-link" href="pesanan.html">
          <img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt="">
          <span>Pesanan</span>
        </a>
        <a class="menu-link" href="produksi.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt="">
          <span>Produksi Jahit</span>
        </a>
        <a class="menu-link active" href="produk.html" aria-current="page">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt="">
          <span>Produk</span>
        </a>
        <a class="menu-link" href="pemasaran.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt="">
          <span>Pemasaran</span>
        </a>
        <a class="menu-link" href="pembukuan.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt="">
          <span>Pembukuan</span>
        </a>
        <a class="menu-link" href="pengaturan.html">
          <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt="">
          <span>Pengaturan</span>
        </a>
      </nav>
    </aside>

    <main class="main-content edit-content">
      <header class="header" aria-label="Navigasi halaman"></header>

      <section class="edit-heading">
        <a class="title-icon back-title-button" href="produk.html" aria-label="Kembali ke daftar produk" title="Kembali ke daftar produk"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M12 19l-7-7 7-7" /></svg></a>
        <div>
          <h1>Tambah Produk</h1>
          <p>Tambahkan produk baru ke katalog Uti Karawo.</p>
        </div>
      </section>

      <div class="edit-layout">
      <section class="edit-panel">
        <div class="form-main">

          <div class="product-media">
            <div class="photo-label">Foto Utama</div>
            <label class="main-photo upload-placeholder">
              <input type="file" accept="image/*" class="hidden-file" data-photo="main">
              <div>＋</div><small>Tambah Foto Utama</small>
            </label>

            <div class="thumbnail-list" aria-label="Foto tambahan produk">
              <label class="thumb upload-thumb"><input type="file" accept="image/*" class="hidden-file" data-photo="extra"><span>＋</span></label>
              <label class="thumb upload-thumb"><input type="file" accept="image/*" class="hidden-file" data-photo="extra"><span>＋</span></label>
              <label class="thumb upload-thumb"><input type="file" accept="image/*" class="hidden-file" data-photo="extra"><span>＋</span></label>
              <label class="thumb upload-thumb"><input type="file" accept="image/*" class="hidden-file" data-photo="extra"><span>＋</span></label>
            </div>
          </div>

          <form class="product-form" id="editProductForm">
            <div class="field full">
              <label for="productName">Nama Produk</label>
              <input id="productName" name="productName" value="" type="text">
            </div>

            <div class="field">
              <label for="category">Kategori Produk</label>
              <select id="category" name="category">
                <option selected disabled>Pilih Kategori</option>
                <option>Kemeja</option><option>Blouse</option><option>Jas</option><option>Dress</option><option>Atasan</option><option>Lainnya</option>
              </select>
            </div>

            <div class="field">
              <label>Motif Sulaman Produk</label>
              <div class="motif-box">
                <label class="motif-image upload-color"><input type="file" accept="image/*" class="hidden-file"><span>＋</span><small>Foto Motif</small></label>
                <input id="motifName" type="text" placeholder="Nama motif sulaman">
              </div>
            </div>

            <div class="field-grid two">
              <div class="field">
                <label for="price">Harga</label>
                <input id="price" name="price" value="" type="text">
              </div>
              <div class="field">
                <label for="stock">Stok</label>
                <div class="input-suffix">
                  <input id="stock" name="stock" value="" type="number" min="0">
                  <span>pcs</span>
                </div>
              </div>
            </div>

            <div class="field">
              <label>Warna Kain</label>
              <div class="fabric-color-single">
                <label class="color-image upload-color"><input type="file" accept="image/*" class="hidden-file"><span>＋</span><small>Foto Kain</small></label>
                <input id="fabricColor" type="text" class="color-name-input" placeholder="Nama warna kain">
              </div>
            </div>

            <div class="field-grid two size-fabric-row">
              <div class="field">
                <label>Ukuran Tersedia</label>
                <div class="size-row">
                  <button class="size-btn" type="button">S</button>
                  <button class="size-btn" type="button">M</button>
                  <button class="size-btn" type="button">L</button>
                  <button class="size-btn" type="button">XL</button>
                </div>
              </div>

              <div class="field">
                <label for="jenisKain">Jenis Kain</label>
                <input id="jenisKain" type="text" placeholder="Contoh: Katun, Sutra, Wol">
              </div>
            </div>


          </form>
        </div>

        <div class="field full description-field">
              <div class="label-row">
                <label for="description">Deskripsi</label>
                <span>121/500</span>
              </div>
              <textarea id="description" name="description" maxlength="500" placeholder="Masukkan deskripsi produk..."></textarea>
            </div>

        <div class="edit-footer add-footer">
          <div class="footer-actions">
            <button class="cancel-btn" type="button">Batal</button>
            <button class="save-btn" type="button" onclick="document.getElementById('editProductForm').requestSubmit()">
              <span aria-hidden="true">＋</span> Tambah Produk
            </button>
            <a class="stock-link-btn" href="stok_warna_motif.html">Stok</a>
          </div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script><script src="../js/nouva-supabase.js"></script><script src="../js/nouva-cloudinary.js"></script>
  <script>
const form=document.getElementById("editProductForm"), photoInputs=[...document.querySelectorAll('[data-photo]')];
let busy=false;
const selectedFiles={main:null,extra:[]};
function client(){if(!window.nouvaSupabaseReady||!window.nouvaSupabase)throw Error("Koneksi Supabase belum siap. Periksa js/nouva-config.js.");return window.nouvaSupabase;}
async function checkAdmin(){const sb=client(),{data:{session}}=await sb.auth.getSession();if(!session){alert("Silakan login sebagai admin.");location.href="../auth/login_admin.html";throw Error("Belum login");}const {data:p,error}=await sb.from("profiles").select("role,full_name").eq("id",session.user.id).single();if(error||p?.role!=="admin"){await sb.auth.signOut();alert("Halaman ini khusus admin.");location.href="../auth/login_admin.html";throw Error("Bukan admin");}if(p.full_name)document.querySelector(".admin-name").textContent=p.full_name;}
function previewFile(input,target){const file=input.files?.[0];if(!file)return;if(input.dataset.photo==="main")selectedFiles.main=file;else if(input.dataset.photo==="extra"){const index=photoInputs.filter(x=>x.dataset.photo==="extra").indexOf(input);selectedFiles.extra[index]=file;}else if(input.closest(".motif-box"))selectedFiles.motif=file;else selectedFiles.fabric=file;const url=URL.createObjectURL(file);target.style.backgroundImage=`url("${url}")`;target.style.backgroundSize="cover";target.style.backgroundPosition="center";target.querySelectorAll(":scope > div,:scope > small,:scope > span").forEach(el=>el.style.display="none");}
document.querySelectorAll("[data-photo]").forEach(input=>input.addEventListener("change",()=>previewFile(input,input.parentElement)));
document.querySelectorAll(".upload-color input").forEach(input=>input.addEventListener("change",()=>previewFile(input,input.parentElement)));
document.querySelectorAll(".size-btn").forEach(button=>button.addEventListener("click",()=>button.classList.toggle("selected")));
document.querySelector(".cancel-btn").addEventListener("click",()=>location.href="produk.html");
const description=document.getElementById("description");description.addEventListener("input",()=>document.querySelector(".label-row span").textContent=`${description.value.length}/500`);
function priceNumber(value){const n=Number(String(value).replace(/[^\d]/g,""));return Number.isFinite(n)?n:0;}
async function upload(file,folder){return file?await window.nouvaUploadImage(file,folder):null;}
form.addEventListener("submit",async event=>{
 event.preventDefault();if(busy)return;
 const name=document.getElementById("productName").value.trim(),category=document.getElementById("category").value,price=priceNumber(document.getElementById("price").value),stock=Number(document.getElementById("stock").value),fabricColor=document.getElementById("fabricColor").value.trim(),motifName=document.getElementById("motifName").value.trim(),sizes=[...document.querySelectorAll(".size-btn.selected")].map(b=>b.textContent.trim()),fabricType=document.getElementById("jenisKain").value.trim(),desc=description.value.trim();
 if(!name){alert("Nama produk wajib diisi.");return;}if(!category||category==="Pilih Kategori"){alert("Pilih kategori produk.");return;}if(!price||price<0){alert("Masukkan harga produk yang valid.");return;}if(!Number.isInteger(stock)||stock<0){alert("Stok harus berupa bilangan bulat nol atau lebih.");return;}if(!fabricColor){alert("Nama warna kain wajib diisi.");return;}if(!sizes.length){alert("Pilih minimal satu ukuran.");return;}
 busy=true;const saveButton=document.querySelector(".save-btn");saveButton.disabled=true;saveButton.textContent="Menyimpan...";
 try{
  const sb=client();await checkAdmin();
  const main=await upload(selectedFiles.main,"nouva/products");
  const extra=await Promise.all(selectedFiles.extra.filter(Boolean).map(f=>upload(f,"nouva/products")));
  const motif=await upload(selectedFiles.motif,"nouva/motifs");
  const fabric=await upload(selectedFiles.fabric,"nouva/fabrics");
  const {data:product,error:pe}=await sb.from("products").insert({name,category,description:desc||null,fabric_type:fabricType||null,motif_name:motifName||null,motif_image_url:motif?.url||null,price,is_active:true}).select("id,reference_no").single();
  if(pe)throw pe;
  const imageUrls=[main,...extra].filter(Boolean);
  if(imageUrls.length){const rows=imageUrls.map((im,i)=>({product_id:product.id,image_url:im.url,sort_order:i+1}));const {error}=await sb.from("product_images").insert(rows);if(error)throw error;}
  const variants=sizes.map(size=>({product_id:product.id,size,color_name:fabricColor,color_image_url:fabric?.url||null,stock}));
  const {error:ve}=await sb.from("product_variants").insert(variants);if(ve)throw ve;
  alert(`Produk berhasil disimpan!\nKode produk: ${product.reference_no||"-"}\nStok yang dimasukkan berlaku untuk setiap ukuran yang dipilih.`);
  location.href="produk.html";
 }catch(e){alert("Produk belum berhasil disimpan.\n"+(e.message||"Periksa koneksi, role admin, dan pengaturan Cloudinary."));}
 finally{busy=false;saveButton.disabled=false;saveButton.innerHTML='<span aria-hidden="true">＋</span> Tambah Produk';}
});
checkAdmin().catch(()=>{});
</script>
</body>
</html>
