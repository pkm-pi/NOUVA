<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemasukan | NOUVA</title>
  <link rel="stylesheet" href="../globals.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-finance.js"></script>
  <link rel="stylesheet" href="../css/cttn_pem.css">
</head>
<body>
<main class="pemasukan-page">

  <!-- SIDEBAR SAMA DENGAN HALAMAN PEMBUKUAN -->
  <aside class="sidebar">
    <div class="brand">
      <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
      <div class="brand-name">NOUVA</div>
      <div class="brand-tagline">NOU Menuju Inovasi</div>
    </div>

    <div class="admin-profile">
      <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
      <div class="admin-name">Admin</div>
    </div>

    <nav class="menu" aria-label="Menu aplikasi">
      <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
      <a class="menu-link" href="pesanan.html">
        <img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt="">
        <span>Pesanan</span>
      </a>
      <a class="menu-link" href="produksi.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt="">
        <span>Produksi Jahit</span>
      </a>
      <a class="menu-link" href="produk.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt="">
        <span>Produk</span>
      </a>
      <a class="menu-link" href="pemasaran.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt="">
        <span>Pemasaran</span>
      </a>
      <a class="menu-link active" href="pembukuan.html" aria-current="page">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt="">
        <span>Pembukuan</span>
      </a>
      <a class="menu-link" href="pengaturan.html">
        <img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt="">
        <span>Pengaturan</span>
      </a>
    </nav>
  </aside>

  <section class="main-content">

    <header class="page-header">
      <div class="breadcrumb">
        <a href="pembukuan.html">Pembukuan</a>
        <span>›</span>
        <strong>Pemasukan</strong>
      </div>
    </header>

    <section class="filter-row">
      <div class="date-range-box">
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateStart" aria-label="Pilih tanggal mulai">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateStartDisplay" class="date-display" type="text" value="28/08/2026" readonly aria-label="Tanggal mulai">
          <input id="dateStart" class="date-picker-hidden" type="date" value="2026-08-28" aria-label="Tanggal mulai">
        </div>
        <span class="range-dash">–</span>
        <div class="date-control">
          <button class="calendar-button" type="button" data-picker="dateEnd" aria-label="Pilih tanggal akhir">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path>
            </svg>
          </button>
          <input id="dateEndDisplay" class="date-display" type="text" value="30/08/2026" readonly aria-label="Tanggal akhir">
          <input id="dateEnd" class="date-picker-hidden" type="date" value="2026-08-30" aria-label="Tanggal akhir">
        </div>
      </div>

      <button class="add-income-btn" id="openIncomeModal" type="button">
        <span>＋</span> Catat Pemasukan
      </button>
    </section>

    <section class="income-panel">
      <div class="table-wrap">
        <table class="income-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Transaksi</th>
              <th>Keterangan</th>
              <th>No.<br>Referensi</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="incomeBody"></tbody>
        </table>

      </div>

      <div class="table-footer">
        <strong>Total Pemasukan</strong>
        <strong id="totalIncomePage">Rp 0</strong>
      </div>
    </section>

    <div class="back-below-table">
      <a class="back-income-btn" href="pembukuan.html">← Kembali</a>
    </div>

  </section>
</main>

<!-- MODAL CATAT PEMASUKAN -->
<div class="modal" id="incomeModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-heading">
      <div>
        <h2>Catat Pemasukan</h2>
        <p>Tambahkan transaksi pemasukan baru.</p>
      </div>
      <button class="close-btn" id="closeIncomeModal" type="button">×</button>
    </div>

    <form id="incomeForm">
      <div class="form-grid">
        <label>
          Tanggal
          <input id="incomeDate" type="date" required>
        </label>

        <label>
          Keterangan
          <select id="incomeCategory" required>
            <option value="CUSTOM">CUSTOM</option>
            <option value="DISPLAY">DISPLAY</option>
          </select>
        </label>

        <label class="full">
          Transaksi
          <input id="incomeDescription" type="text" value="Penjualan" readonly>
        </label>

        <label class="full">
          No. Referensi
          <input id="incomeReference" type="text" placeholder="Contoh: 000-000">
        </label>

        <label class="full">
          Nominal
          <input id="incomeAmount" type="number" min="0" step="1000" placeholder="1250000" required>
        </label>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelIncome" type="button">Batal</button>
        <button class="save-btn" type="submit">Simpan Pemasukan</button>
      </div>
    </form>
  </div>
</div>

<script>
const db=window.nouvaFinanceClient;
const incomeBody=document.getElementById('incomeBody'), totalIncomePage=document.getElementById('totalIncomePage');
const dateStart=document.getElementById('dateStart'), dateEnd=document.getElementById('dateEnd');
const modal=document.getElementById('incomeModal'), form=document.getElementById('incomeForm');
let incomeRows=[];
const rupiah=v=>'Rp '+Number(v||0).toLocaleString('id-ID');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function fmt(d){if(!d)return '-';return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function fmtInput(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`;}
function syncDates(){document.getElementById('dateStartDisplay').value=fmtInput(dateStart.value);document.getElementById('dateEndDisplay').value=fmtInput(dateEnd.value);}
function keepRange(changed){if(dateStart.value&&dateEnd.value&&dateEnd.value<dateStart.value){if(changed===dateStart)dateEnd.value=dateStart.value;else dateStart.value=dateEnd.value;}syncDates();}
async function loadIncome(){
 if(!db){alert('Supabase belum terhubung. Periksa nouva-config.js dan koneksi internet.');return;}
 const {data,error}=await db.from('income_records').select('id,transaction_date,description,transaction_type,reference_no,amount,source,order_id,created_at').order('transaction_date',{ascending:false});
 if(error){alert('Gagal memuat pemasukan: '+window.nouvaFinanceError(error));return;}
 incomeRows=(data||[]).map(r=>({id:r.id,date:r.transaction_date,description:r.description,category:r.transaction_type,reference:r.reference_no,orderId:r.order_id,amount:Number(r.amount||0),createdAt:new Date(r.created_at).getTime(),accountingLabel:r.description==='Penjualan'?`Penjualan - ${r.reference_no}`:r.description}));
 renderIncome();
}
function renderIncome(){let rows=incomeRows.filter(r=>(!dateStart.value||r.date>=dateStart.value)&&(!dateEnd.value||r.date<=dateEnd.value));rows.sort((a,b)=>b.date.localeCompare(a.date));
 incomeBody.innerHTML=rows.length?rows.map(r=>`<tr><td>${fmt(r.date)}</td><td class="transaction-name">${esc(r.description||'-')}</td><td>${esc(r.category||'-')}</td><td>${esc(r.reference||'-')}</td><td class="amount-cell">${rupiah(r.amount)}</td><td>${r.orderId?'<span title="Pemasukan otomatis dari pesanan">—</span>':`<button class="delete-row" type="button" data-id="${r.id}" title="Hapus">×</button>`}</td></tr>`).join(''):`<tr class="empty-row"><td colspan="6">Belum ada data pemasukan pada periode yang dipilih.</td></tr>`;
 totalIncomePage.textContent=rupiah(rows.reduce((a,r)=>a+r.amount,0));
 incomeBody.querySelectorAll('.delete-row').forEach(b=>b.addEventListener('click',()=>deleteIncome(b.dataset.id)));
}
async function deleteIncome(id){if(!confirm('Hapus transaksi pemasukan ini?'))return;const {error}=await db.from('income_records').delete().eq('id',id);if(error){alert('Gagal menghapus: '+window.nouvaFinanceError(error));return;}await loadIncome();}
function openModal(){form.reset();document.getElementById('incomeDate').value=new Date().toISOString().slice(0,10);document.getElementById('incomeDescription').value='Penjualan';document.getElementById('incomeReference').value='';modal.classList.add('show');modal.setAttribute('aria-hidden','false');}
function closeModal(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true');form.reset();}
document.getElementById('openIncomeModal').addEventListener('click',openModal);document.getElementById('closeIncomeModal').addEventListener('click',closeModal);document.getElementById('cancelIncome').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
form.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!db){alert('Supabase belum terhubung.');return;}
 const category=document.getElementById('incomeCategory').value;
 let reference=document.getElementById('incomeReference').value.trim();
 if(!reference)reference='MAN-'+Date.now();
 // Referensi ORD/CUS mungkin sudah tercatat otomatis dari pesanan.
 const existing=incomeRows.find(r=>String(r.reference||'').trim().toLowerCase()===reference.toLowerCase());
 if(existing){
   const kind=existing.orderId?'otomatis dari pesanan':'pemasukan manual';
   alert(`Nomor referensi ${reference} sudah tercatat sebagai ${kind} pada ${fmt(existing.date)} (${rupiah(existing.amount)}).\n\nGunakan nomor referensi lain jika ini transaksi yang berbeda. Jika ini pembayaran untuk pesanan yang sama, jangan catat ulang di menu Pemasukan.`);
   return;
 }
 // Pastikan transaksi dicatat oleh sesi admin yang sedang aktif.
 const {data:authData,error:authError}=await db.auth.getUser();
 const currentUser=authData?.user;
 if(authError||!currentUser){
   alert('Sesi login tidak ditemukan. Silakan login ulang menggunakan akun admin.');
   return;
 }
 const payload={transaction_date:document.getElementById('incomeDate').value,description:document.getElementById('incomeDescription')?.value?.trim()||'Penjualan',transaction_type:category,reference_no:reference,amount:Number(document.getElementById('incomeAmount').value),source:'other',order_id:null,created_by:currentUser.id};
 const {error}=await db.from('income_records').insert(payload);
 if(error){
   if(error.code==='23505'){
     alert(`Nomor referensi ${reference} sudah digunakan pada catatan pemasukan lain. Silakan periksa daftar pemasukan atau gunakan nomor referensi berbeda.`);
     await loadIncome();
     return;
   }
   if(error.code==='42501'||/row-level security|permission denied/i.test(error.message||'')){
     alert('Supabase menolak penyimpanan karena akun ini belum dikenali sebagai admin oleh RLS. Jalankan SQL MIGRATION_FIX_INCOME_RLS.sql, lalu pastikan profiles.role untuk akun yang sedang login bernilai admin. Setelah itu logout dan login kembali.');
     console.error('RLS income_records:',error);
     return;
   }
   alert('Gagal menyimpan pemasukan: '+window.nouvaFinanceError(error));
   console.error(error);
   return;
 }
 closeModal();
 await loadIncome();
});
dateStart.addEventListener('change',()=>{keepRange(dateStart);renderIncome();});dateEnd.addEventListener('change',()=>{keepRange(dateEnd);renderIncome();});
document.querySelectorAll('.calendar-button').forEach(b=>b.addEventListener('click',()=>{const p=document.getElementById(b.dataset.picker);if(p?.showPicker)p.showPicker();else p?.click();}));
const today=new Date(),todayKey=today.toISOString().slice(0,10),monthStart=todayKey.slice(0,8)+'01';dateStart.value=monthStart;dateEnd.value=todayKey;syncDates();loadIncome();
</script>
</body>
</html>
