<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan Admin - NOUVA</title>

  <link rel="stylesheet" href="../globals.css">
  <link rel="stylesheet" href="../css/pengaturan.css">
</head>

<body>
  <div class="dashboard-admin">

    <aside class="sidebar">
    <div class="brand">
      <img class="logo-nouva-FIKS" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="Logo Nouva">
      <div class="brand-name">NOUVA</div>
      <div class="brand-tagline">NOU Menuju Inovasi</div>
    </div>

    <div class="admin-profile">
      <img class="profile" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/profile.png" alt="Admin">
      <div class="admin-name">Admin</div>
    </div>

    <nav class="menu" aria-label="Menu aplikasi">
      <a class="menu-link dashboard-menu-link" href="dashboard_admin.html">
          <img class="desktop-dashboard-icon" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--3--1.png" alt="">
          <img class="mobile-dashboard-logo" src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/logo-nouva-fiks-2.png" alt="">
          <span>Dashboard</span>
        </a>
      <a class="menu-link" href="pesanan.html"><img src="https://c.animaapp.com/P7Ah09FQ/img/image-removebg-preview--12--3@2x.png" alt=""><span>Pesanan</span></a>
      <a class="menu-link" href="produksi.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--13--1.png" alt=""><span>Produksi Jahit</span></a>
      <a class="menu-link" href="produk.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--14--1.png" alt=""><span>Produk</span></a>
      <a class="menu-link" href="pemasaran.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--17--1.png" alt=""><span>Pemasaran</span></a>
      <a class="menu-link" href="pembukuan.html"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--18--1.png" alt=""><span>Pembukuan</span></a>
      <a class="menu-link active" href="pengaturan.html" aria-current="page"><img src="https://c.animaapp.com/taWkMOk-lcagfB1Ij_oiSw/img/image-removebg-preview--15--1.png" alt=""><span>Pengaturan</span></a>
    </nav>
  </aside>

    <main class="main-content pengaturan-content">
      <header class="header pengaturan-header">
        <div class="welcome">
          <div class="pengaturan-title">
            <div>
              <h1>Pengaturan</h1>
              <p>Atur akun kamu dengan mudah.</p>
            </div>
          </div>
        </div>
      </header>

      <p id="accountMessage" class="account-message" role="status" aria-live="polite"></p>

      <section class="settings-list" aria-label="Pengaturan akun">

        <article class="setting-card">
          <div class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
            </svg>
          </div>

          <div class="setting-content">
            <label for="namaKamu">Nama Kamu</label>
            <div class="setting-row">
              <input id="namaKamu" type="text" placeholder="Nama Lengkap Kamu">
              <button class="setting-btn" type="button" data-target="namaKamu">Simpan</button>
            </div>
          </div>
        </article>

        <article class="setting-card">
          <div class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v14h10V5H7Zm5 13a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 12 18Z"/>
            </svg>
          </div>

          <div class="setting-content">
            <label for="nomorHp">Nomor HP</label>
            <div class="setting-row">
              <input id="nomorHp" type="tel" placeholder="08xxxxxxxxxx">
              <button class="setting-btn" type="button" data-target="nomorHp">Simpan</button>
            </div>
          </div>
        </article>

        <article class="setting-card">
          <div class="setting-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V6Zm7 13H7v-9h10v9Zm-5-2a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
            </svg>
          </div>

          <div class="setting-content">
            <label for="kataSandi">Kata Sandi</label>
            <div class="setting-row">
              <input id="kataSandi" type="password" value="********" readonly>
              <button class="setting-btn password-btn" type="button" id="passwordButton">
                Ganti Kata Sandi
              </button>
            </div>
          </div>
        </article>

      </section>

      <div class="settings-actions">
        <button class="logout-btn" type="button" id="logoutButton" onclick="window.nouvaLogoutAdmin(event)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17v2H5V5h5v2H7v10h3Zm8-5-4-4v3H10v2h4v3l4-4Z"/>
          </svg>
          <span>Keluar</span>
        </button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nouva-config.js"></script>
  <script src="../js/nouva-supabase.js"></script>
  <script src="../js/pengaturan-akun.js"></script>
  <script>
    // Handler mandiri agar tombol Keluar tetap bekerja meskipun inisialisasi
    // halaman pengaturan gagal atau script akun mengalami kendala.
    window.nouvaLogoutAdmin = async function (event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const button = document.getElementById("logoutButton");
      if (button) {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        button.innerHTML = "Keluar...";
      }
      try {
        const client = window.nouvaSupabase;
        if (client && client.auth && typeof client.auth.signOut === "function") {
          const { error } = await client.auth.signOut();
          if (error) console.error("Supabase signOut:", error);
        }
      } catch (error) {
        console.error("Logout NOUVA:", error);
      } finally {
        // Dari /NOUVA/admin/pengaturan.html menuju /NOUVA/index.html.
        window.location.href = "../index.html";
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof window.initNouvaAccountSettings === "function") {
        window.initNouvaAccountSettings({ expectedRole: "admin", loginUrl: "../auth/login_admin.html" });
      }
    });
  </script>
</body>
</html>
